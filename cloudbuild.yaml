# Cloud Build → Artifact Registry → Cloud Run (asia-south1)
#
# Required secrets in Secret Manager (create via infra/gcp/setup-secrets.sh):
#   craftguru-database-url, craftguru-razorpay-key-id, craftguru-razorpay-key-secret
# Optional: whatsapp, bill secret, otp pepper, google client id, smtp pass, vendor password
# All mapped in deploy step below (create via infra/gcp/setup-secrets.sh).
#
# Substitutions:
#   _REGION _SERVICE _AR_REPO _MIN_INSTANCES

substitutions:
  _REGION: asia-south1
  _SERVICE: craftguru-api
  _AR_REPO: craftguru
  _MIN_INSTANCES: "1"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=2
      - --memory=2Gi
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=30
      - --concurrency=40
      - --timeout=300
      - --cpu-boost
      - --execution-environment=gen2
      - --startup-probe=httpGet.path=/health,httpGet.port=8080,initialDelaySeconds=3,timeoutSeconds=3,periodSeconds=8,failureThreshold=6
      - --liveness-probe=httpGet.path=/health,httpGet.port=8080,timeoutSeconds=3,periodSeconds=30,failureThreshold=3
      - --env-vars-file=infra/gcp/env.cloudrun.yaml
      - --set-secrets=DATABASE_URL=craftguru-database-url:latest,GOOGLE_CLIENT_ID=craftguru-google-client-id:latest,GMAIL_APP_PASSWORD=craftguru-smtp-pass:latest,VENDOR_PORTAL_PASSWORD=craftguru-vendor-portal-password:latest
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest

timeout: 1800s
