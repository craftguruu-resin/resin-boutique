# Cloud Build → Artifact Registry → Cloud Run (asia-south1)
#
# Required secrets in Secret Manager (create via infra/gcp/setup-secrets.sh):
#   craftguru-database-url, craftguru-razorpay-key-id, craftguru-razorpay-key-secret
# Optional: whatsapp, bill secret, otp pepper, google client id, smtp pass, vendor password
#
# Substitutions:
#   _REGION _SERVICE _AR_REPO _MIN_INSTANCES

substitutions:
  _REGION: asia-south1
  _SERVICE: craftguru-api
  _AR_REPO: craftguru
  _MIN_INSTANCES: "0"

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --file=Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest
      - .

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=1Gi
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=20
      - --concurrency=80
      - --timeout=300
      - --cpu-boost
      - --execution-environment=gen2
      - --session-affinity
      - --env-vars-file=infra/gcp/env.cloudrun.yaml
      - --set-secrets=DATABASE_URL=craftguru-database-url:latest,RAZORPAY_KEY_ID=craftguru-razorpay-key-id:latest,RAZORPAY_KEY_SECRET=craftguru-razorpay-key-secret:latest
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest

timeout: 1800s
