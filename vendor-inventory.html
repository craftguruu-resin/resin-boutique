<!DOCTYPE html>
<!-- Local dev: data-bill-api-base points at Node. Production uses the same host. -->
<html lang="en" data-bill-api-base="" data-bill-api-port="" data-bill-api-secret="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/favicon.ico?v=20260730" />
  <link rel="icon" href="media/brand-craftguru.png?v=20260730" type="image/png" sizes="32x32" />
  <link rel="icon" href="media/brand-craftguru.png?v=20260730" type="image/png" sizes="192x192" />
  <link rel="apple-touch-icon" href="media/brand-craftguru.png?v=20260730" />
  <title>Inventory — Craftguru vendor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="vendor-saas.css?v=20260925inventory6" />
  <link rel="stylesheet" href="vendor-modern.css?v=20260926a" />
  <link rel="stylesheet" href="craftguru-theme.css" />
</head>
<body class="vendor-saas" data-vendor-nav="inventory">
  <div class="vs-app">
    <div id="vsSidebarMount"></div>
    <div class="vs-main">
      <header class="vs-topbar">
        <div>
          <h1 class="vs-topbar__title">Inventory</h1>
          <p class="vs-topbar__sub">Manage stock for each storefront catalogue.</p>
        </div>
        <div class="vs-topbar__actions">
          <button type="button" class="vs-btn" id="viRefreshBtn">Refresh</button>
        </div>
      </header>

      <div class="vs-content">
        <div id="viDeskSection">
          <div class="vi-tabbar vs-row-actions" style="margin-bottom: 1rem; flex-wrap: wrap; gap: 0.5rem">
            <button type="button" class="vs-btn vs-btn--primary vi-tab" data-tab="resin">Resin Home inventory</button>
            <button type="button" class="vs-btn vs-btn--ghost vi-tab" data-tab="raw">Raw material inventory</button>
            <button type="button" class="vs-btn vs-btn--ghost vi-tab" data-tab="photo">Photo frame inventory</button>
          </div>

          <div id="viCatalogPanel" hidden>
            <p class="vs-muted" id="viCatalogStats" style="margin: 0 0 0.75rem; font-size: 0.82rem" hidden></p>
            <div class="vs-card" style="margin-bottom: 1rem">
              <div class="vs-row-actions" style="flex-wrap: wrap; align-items: flex-end; gap: 0.5rem">
                <div class="vs-field" style="margin: 0; flex: 1; min-width: 12rem">
                  <label for="viCatalogSearch">Search</label>
                  <input type="search" id="viCatalogSearch" placeholder="Name, product id, or SKU…" />
                </div>
                <button type="button" class="vs-btn vs-btn--primary" id="viCatalogSearchBtn">Search</button>
              </div>
            </div>
            <div class="vs-table-wrap">
              <table class="vs-table">
                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Category</th>
                    <th title="For legacy products without configured options">S stock</th>
                    <th title="For legacy products without configured options">M stock</th>
                    <th title="For legacy products without configured options">L stock</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="viCatalogTbody"></tbody>
              </table>
            </div>
            <p class="vs-muted" id="viCatalogPaging" style="margin: 0.65rem 0 0"></p>
            <button type="button" class="vs-btn" id="viCatalogMoreBtn" hidden>Load more</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="vendor-shell.js"></script>
  <script src="vendor-inventory.js?v=20260926inventory8"></script>
</body>
</html>
