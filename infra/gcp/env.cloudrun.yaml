# Non-secret environment variables for Cloud Run (committed template).
# Edit ALLOWED_ORIGIN and mail settings before deploy.
# Secrets are injected via --set-secrets in cloudbuild.yaml.

NODE_ENV: production
ALLOWED_ORIGIN: "https://www.craftguruindia.com,https://craftguruindia.com"
VENDOR_REQUIRE_AUTH: "1"
META_GRAPH_VERSION: v21.0
PG_POOL_MAX: "10"
GUEST_SESSION_DAYS: "30"
VENDOR_PORTAL_USER: nammu
# Mail transport (non-secret fields). Password via Secret Manager → SMTP_PASS.
# SMTP_HOST: smtp.example.com
# SMTP_PORT: "587"
# SMTP_SECURE: "false"
# SMTP_USER: orders@craftguru.co.in
# MAIL_FROM: "Craftguru <orders@craftguru.co.in>"
