# Non-secret Cloud Run environment (committed).
# Secrets → Secret Manager via --set-secrets in cloudbuild.yaml / deploy scripts.
# Edit ALLOWED_ORIGIN before production cutover.

NODE_ENV: "production"
HOST: "0.0.0.0"
PORT: "8080"
ALLOWED_ORIGIN: "https://www.craftguruindia.com,https://craftguruindia.com"
VENDOR_REQUIRE_AUTH: "1"
VENDOR_PORTAL_USER: "nammu"
META_GRAPH_VERSION: "v21.0"
PG_POOL_MAX: "5"
PG_IDLE_TIMEOUT_MS: "30000"
PG_CONNECT_TIMEOUT_MS: "10000"
PG_SSL: "true"
GUEST_SESSION_DAYS: "30"
# Uncomment if using SMTP (password via Secret Manager → SMTP_PASS):
# SMTP_HOST: "smtp.example.com"
# SMTP_PORT: "587"
# SMTP_SECURE: "false"
# SMTP_USER: "orders@craftguru.co.in"
# MAIL_FROM: "Craftguru <orders@craftguru.co.in>"
# Or Gmail (password via same craftguru-smtp-pass secret → GMAIL_APP_PASSWORD):
# GMAIL_USER: "you@gmail.com"
# MAIL_FROM: "Craftguru <you@gmail.com>"
