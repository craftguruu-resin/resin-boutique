# Deploy Craftguru to Google Cloud on push to main.
#
# Required GitHub repository secrets:
#   GCP_PROJECT_ID          — GCP project ID
#   GCP_WORKLOAD_IDENTITY_PROVIDER — projects/NUM/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
#   GCP_SERVICE_ACCOUNT     — deployer@PROJECT.iam.gserviceaccount.com
#   PUBLIC_BILL_API_BASE    — https://api.yourdomain.com (no trailing slash)
#   PUBLIC_BILL_CLIENT_SECRET — optional; matches BILL_API_SECRET
#
# One-time GCP setup: see docs/GCP-MIGRATION.md § "Workload Identity Federation"

name: Deploy to Google Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_REGION: asia-south1
  GCP_SERVICE: craftguru-api
  GCP_AR_REPO: craftguru

jobs:
  deploy-api:
    name: Cloud Run API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build (API)
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions="_REGION=${GCP_REGION},_SERVICE=${GCP_SERVICE},_AR_REPO=${GCP_AR_REPO},_MIN_INSTANCES=0" \
            .

  deploy-hosting:
    name: Firebase Hosting
    runs-on: ubuntu-latest
    needs: deploy-api
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Patch storefront API base URL
        env:
          PUBLIC_BILL_API_BASE: ${{ secrets.PUBLIC_BILL_API_BASE }}
          PUBLIC_BILL_CLIENT_SECRET: ${{ secrets.PUBLIC_BILL_CLIENT_SECRET }}
        run: node tools/set-bill-api-base.js

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project "${{ secrets.GCP_PROJECT_ID }}" --non-interactive
