# Deploy Craftguru API to Google Cloud Run on push to main.
# Static storefront: Firebase Hosting (optional second job).
#
# GitHub repository secrets:
#   GCP_PROJECT_ID
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#   GCP_SERVICE_ACCOUNT
#   PUBLIC_BILL_API_BASE          (e.g. https://api.craftguruindia.com)
#   PUBLIC_BILL_CLIENT_SECRET     (optional; matches BILL_API_SECRET)
#
# Setup: docs/RENDER-TO-GCP-ZERO-DOWNTIME.md

name: Deploy to Google Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GCP_REGION: asia-south1
  GCP_SERVICE: craftguru-api
  GCP_AR_REPO: craftguru

jobs:
  deploy-api:
    name: Build & Deploy Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Submit Cloud Build (Docker → Artifact Registry → Cloud Run)
        run: |
          gcloud builds submit \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --config=cloudbuild.yaml \
            --substitutions="_REGION=${GCP_REGION},_SERVICE=${GCP_SERVICE},_AR_REPO=${GCP_AR_REPO},_MIN_INSTANCES=0" \
            .

      - name: Verify health
        run: |
          URL=$(gcloud run services describe "${GCP_SERVICE}" \
            --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${GCP_REGION}" \
            --format='value(status.url)')
          echo "Service URL: $URL"
          curl -fsS "${URL}/health"
          echo ""
          curl -fsS "${URL}/api/health" | head -c 500
          echo ""

  deploy-hosting:
    name: Firebase Hosting (storefront)
    runs-on: ubuntu-latest
    needs: deploy-api
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Patch storefront API base URL
        env:
          PUBLIC_BILL_API_BASE: ${{ secrets.PUBLIC_BILL_API_BASE }}
          PUBLIC_BILL_CLIENT_SECRET: ${{ secrets.PUBLIC_BILL_CLIENT_SECRET }}
        run: node tools/set-bill-api-base.js

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project "${{ secrets.GCP_PROJECT_ID }}" --non-interactive
        continue-on-error: true
